<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <nav>
            <div class="left">Kanban Board</div>
            <div class="right">
                <input type="text" id="search-input" placeholder="Search tasks...">
                <button id="toggle-modal">Add New Task</button>
                <button id="clear-board">Clear Board</button>
                <button id="theme-toggle">Dark</button>
            </div>
        </nav>

        <div class="progress-wrapper">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <span class="progress-label" id="progress-label">0% complete</span>
        </div>

        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading"><div class="left">To Do</div><div class="right">0</div></div>
            </div>
            <div id="progress" class="task-column">
                <div class="heading"><div class="left">In Progress</div><div class="right">0</div></div>
            </div>
            <div id="done" class="task-column">
                <div class="heading"><div class="left">Done</div><div class="right">0</div></div>
            </div>
        </section>
    </main>

    <!-- Single modal, used for both "Add Task" and "Edit Task" -->
    <div class="modal" id="task-modal">
        <div class="bg"></div>
        <div class="center">
            <h2 id="modal-title">Add Task</h2>
            <input id="task-title-input" type="text" placeholder="Task Title">
            <textarea id="task-desc-input" placeholder="Task Description"></textarea>
            <label for="task-priority">Priority</label>
            <select id="task-priority">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
            </select>
            <label for="task-due-date">Due Date & Time</label>
            <input type="datetime-local" id="task-due-date">
            <button id="save-task-btn">Add Task</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
